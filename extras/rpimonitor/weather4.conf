Locale
dynamic.27.name=location
dynamic.27.source=curl -sSfLm 2 wttr.in/?format="%l" 2>&1
dynamic.27.regexp=(.*)
dynamic.27.postprocess=$1
dynamic.27.rrd=<Define the rrd type>
#Temperature
dynamic.28.name=weathertemp
dynamic.28.source=curl -sSfLm 2 wttr.in/?format="%l:+%C+%t+%w\n" 2>&1
dynamic.28.regexp=(\++\d+)
dynamic.28.postprocess=$1
dynamic.28.rrd=<Define the rrd type>

#WindGust
dynamic.29.name=windgust
dynamic.29.source=curl -sSfLm 2 wttr.in/?format="%l:+%C+%t+%w\n" 2>&1
dynamic.29.regexp=\++\d+(\d)
dynamic.29.postprocess=$1
dynamic.29.rrd=<Define the rrd type>

#Condition
dynamic.30.name=condition
dynamic.30.source=curl -sSfLm 2 wttr.in/?format="%C" 2>&1
dynamic.30.regexp=(.*)
dynamic.30.postprocess=$1

